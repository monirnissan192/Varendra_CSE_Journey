<!DOCTYPE html>
<html>
<head>
    <title>Course Registration</title>
    <style>
        body{
            font-family: Arial;
        }
        .box{
            width:320px;
            border:1px solid black;
            padding:20px;
            margin:auto;
            margin-top:40px;
        }
        h3{
            margin-top:0;
        }
        input,textarea{
            margin-top:5px;
            margin-bottom:8px;
        }
        textarea{
            width:250px;
            height:60px;
        }
    </style>
</head>
<body>

<div class="box">
<h3>Course Registration</h3>

<form>
<label for="Name">Name:</label><br>
<input type="text" id="Name" name="Name"><br>

<label for="Email">Email:</label><br>
<input type="email" id="Email" name="Email"><br>

<label for="Password">Password:</label><br>
<input type="password" id="Password" name="Password"><br>

<label for="Gender">Gender:</label><br>
<input type="radio" name="Gender" id ="Male" value="Male">
<label for="Male">Male</label><br>

<input type="radio" name="Gender" id ="Female" value="Female">
<label for="Female">Female</label><br>

<label for="Skills">Skill:</label><br>
<input type="checkbox" name="Skills" id="Skills" Value="HTML">HTML<br>
<input type="checkbox" name="Skills" id="Skills" Value="CSS">CSS<br>
<input type="checkbox" name="Skills" id="Skills" Value="JS">JS<br>


<label for="DOB">DOB:</label><br>
<input type="date" name="DOB" id="DOB" value="DOB"><br>


<label for="Photo">Photo:</label><br>
<input type="file" name="Photo" id="Photo" value="Photo"><br>
<!-- <label for="Comment">Comment:</label><br>
<textarea></textarea><br> -->

<label for="Comment">Comment:</label><br>
<textarea id="Comment" name="Comment" rows="4" cols="50"></textarea><br>

<input type="submit" value="Submit">
<input type="reset" value="Reset">

</form>
</div>

</body>
</html>
